<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register for TechCon</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; line-height:1.5; color:#222 }
    header { background:#0b66b2; color:#fff; padding:20px 16px }
    header h1 { margin:0; font-size:1.4rem }
    nav { margin-top:10px }
    nav a { color:#fff; margin-right:12px; text-decoration:none; font-weight:600 }
    .container { max-width:760px; margin:0 auto; padding:0 16px }
    main { padding:24px 0 }
    .btn { display:inline-block; background:#0b66b2; color:#fff; padding:10px 14px; text-decoration:none; border-radius:6px }
    footer { background:#f5f5f5; padding:12px 16px; text-align:center; font-size:0.95rem }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Register for TechCon 2024</h1>
      <nav aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <form action="#" method="post" novalidate>
        <fieldset style="border:0; padding:0; margin:0 0 16px 0">
          <legend style="font-size:1.1rem; margin-bottom:8px">Attendee Information</legend>

          <label for="full-name">Full name</label><br>
          <input id="full-name" name="name" type="text" required placeholder="Your full name" style="width:100%; padding:8px; margin:6px 0 12px 0; box-sizing:border-box">

          <label for="email">Email address</label><br>
          <input id="email" name="email" type="email" required placeholder="you@example.com" style="width:100%; padding:8px; margin:6px 0 12px 0; box-sizing:border-box">

          <label for="password">Password</label><br>
          <input id="password" name="password" type="password" required placeholder="Create a password" minlength="8" style="width:100%; padding:8px; margin:6px 0 12px 0; box-sizing:border-box">

          <label for="confirm-password">Confirm password</label><br>
          <input id="confirm-password" name="confirm_password" type="password" required placeholder="Re-enter your password" minlength="8" style="width:100%; padding:8px; margin:6px 0 12px 0; box-sizing:border-box">
        </fieldset>

        <div style="margin-bottom:12px">
          <input id="terms" name="terms" type="checkbox" required>
          <label for="terms">I agree to the <a href="#">terms and conditions</a>.</label>
        </div>

        <div>
          <button type="submit" style="background:#0b66b2; color:#fff; border:none; padding:10px 14px; border-radius:6px; cursor:pointer">Register Now</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>copyright © 2024 TechCon. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
