<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact TechCon</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; line-height:1.5; color:#222 }
    header { background:#0b66b2; color:#fff; padding:20px 16px }
    header h1 { margin:0; font-size:1.4rem }
    nav { margin-top:10px }
    nav a { color:#fff; margin-right:12px; text-decoration:none; font-weight:600 }
    .container { max-width:760px; margin:0 auto; padding:0 16px }
    main { padding:24px 0 }
    .contact-list { list-style:none; padding:0 }
    .contact-list li { margin-bottom:8px }
    .social-links a { margin-right:12px; color:#0b66b2; text-decoration:none }
    .map-wrapper { width:100%; aspect-ratio:16/9; max-width:100%; background:#eee; margin:12px 0 }
    .map-wrapper iframe { width:100%; height:100%; border:0; }
    form input[type="text"], form input[type="email"], form textarea { width:100%; padding:8px; box-sizing:border-box; margin-top:6px; margin-bottom:12px }
    form label { font-weight:600 }
    form button { background:#0b66b2; color:#fff; border:none; padding:10px 14px; border-radius:6px; cursor:pointer }
    footer { background:#f5f5f5; padding:12px 16px; text-align:center; font-size:0.95rem }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Contact Us</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section aria-labelledby="contact-heading">
        <h2 id="contact-heading">Get in touch</h2>

        <p>Email Address: <a href="mailto:email@example.com">email@example.com</a></p>

        <p>Follow us:</p>
        <p class="social-links">
          <a href="https://twitter.com/techcon" target="_blank" rel="noopener noreferrer" aria-label="TechCon on Twitter">Twitter</a>
          <a href="https://www.facebook.com/techcon" target="_blank" rel="noopener noreferrer" aria-label="TechCon on Facebook">Facebook</a>
          <a href="https://www.linkedin.com/company/techcon" target="_blank" rel="noopener noreferrer" aria-label="TechCon on LinkedIn">LinkedIn</a>
        </p>

        <h3>Location</h3>
        <div class="map-wrapper" aria-hidden="false">
          <iframe src="https://www.google.com/maps?q=Moscone%20Center%20San%20Francisco&output=embed" allowfullscreen="" loading="lazy"></iframe>
        </div>

        <h3>Contact Us</h3>
        <form action="#" method="post">
          <label for="contact-name">Name</label>
          <input type="text" id="contact-name" name="name" required placeholder="Your full name">

          <label for="contact-email">Email</label>
          <input id="contact-email" name="email" type="email" required placeholder="you@example.com">

          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" required placeholder="Write your message here"></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>copyright © 2024 TechCon. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
